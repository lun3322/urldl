name: Download File from Issue

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  download:
    if: contains(github.event.issue.title, '[DOWNLOAD]')
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue body for URL
        id: parse
        run: |
          # 从 Issue Body 中提取下载链接
          URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https?://[^\s]+' | head -1)
          echo "download_url=$URL" >> $GITHUB_OUTPUT
          
          # 1. 首先从 URL 中提取文件名
          FILENAME=$(basename "$URL" | cut -d'?' -f1)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Validate URL
        run: |
          if [ -z "${{ steps.parse.outputs.download_url }}" ]; then
            echo "❌ 未找到有效的 URL"
            exit 1
          fi
          echo "✅ 将下载: ${{ steps.parse.outputs.download_url }}"
          echo "✅ 文件名: ${{ steps.parse.outputs.filename }}"

      - name: Download file and extract filename from headers
        id: download
        run: |
          INITIAL_FILENAME="${{ steps.parse.outputs.filename }}"
          FINAL_FILENAME="$INITIAL_FILENAME"
          
          # 2. 尝试从 HTTP 响应头中获取文件名 (Content-Disposition)
          HEADER_FILENAME=$(curl -sI "${{ steps.parse.outputs.download_url }}" \
            -H "User-Agent: Mozilla/5.0" | \
            grep -i "content-disposition" | \
            sed -n 's/.*filename="\([^"]*\)".*/\1/p')
          
          if [ -n "$HEADER_FILENAME" ]; then
            FINAL_FILENAME="$HEADER_FILENAME"
            echo "📄 从响应头中获取文件名: $FINAL_FILENAME"
          elif [ -n "$INITIAL_FILENAME" ] && [ "$INITIAL_FILENAME" != "/" ]; then
            echo "📄 使用从 URL 中提取的文件名: $FINAL_FILENAME"
          else
            # 3. 最后使用默认文件名
            FINAL_FILENAME="downloaded-file-$(date +%s)"
            echo "📄 使用默认文件名: $FINAL_FILENAME"
          fi
          
          echo "final_filename=$FINAL_FILENAME" >> $GITHUB_OUTPUT
          
          # 下载文件
          curl -L \
            -H "User-Agent: Mozilla/5.0" \
            "${{ steps.parse.outputs.download_url }}" \
            -o "$FINAL_FILENAME"

      - name: Check file
        run: ls -lh "${{ steps.download.outputs.final_filename }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: ${{ steps.download.outputs.final_filename }}

      - name: Comment on issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ 文件下载成功！\n\n📥 下载链接: ${{ steps.parse.outputs.download_url }}\n📄 文件名: ${{ steps.download.outputs.final_filename }}\n\n已自动关闭此 Issue。'
            })

      - name: Close issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            })
