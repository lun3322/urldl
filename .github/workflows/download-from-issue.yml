name: Download File from Issue

on:
  issues:
    types: [opened, edited]

jobs:
  download:
    if: contains(github.event.issue.title, '[DOWNLOAD]')
    runs-on: ubuntu-latest
    steps:
      - name: Parse issue body for URL
        id: parse
        run: |
          # 从 Issue Body 中提取下载链接
          URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https?://[^\s]+' | head -1)
          echo "download_url=$URL" >> $GITHUB_OUTPUT
          
          # 从 URL 中提取文件名
          FILENAME=$(basename "$URL" | cut -d'?' -f1)
          # 如果没有获取到文件名，使用默认名称
          [ -z "$FILENAME" ] && FILENAME="downloaded-file-$(date +%s)"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Validate URL
        run: |
          if [ -z "${{ steps.parse.outputs.download_url }}" ]; then
            echo "❌ 未找到有效的 URL"
            exit 1
          fi
          echo "✅ 将下载: ${{ steps.parse.outputs.download_url }}"
          echo "✅ 文件名: ${{ steps.parse.outputs.filename }}"

      - name: Download file
        run: |
          curl -L \
            -H "User-Agent: Mozilla/5.0" \
            "${{ steps.parse.outputs.download_url }}" \
            -o "${{ steps.parse.outputs.filename }}"

      - name: Check file
        run: ls -lh "${{ steps.parse.outputs.filename }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloads
          path: ${{ steps.parse.outputs.filename }}

      - name: Comment on issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ 文件下载成功！\n\n📥 下载链接: ${{ steps.parse.outputs.download_url }}\n📄 文件名: ${{ steps.parse.outputs.filename }}\n\n已自动关闭此 Issue。'
            })

      - name: Close issue
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            })
