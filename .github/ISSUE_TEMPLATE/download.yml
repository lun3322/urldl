name: Download Request
description: 提交一个文件下载请求
title: "[DOWNLOAD] "
labels: ["download"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢您提交下载请求！请按照以下格式填写。
        
  - type: input
    id: download_url
    attributes:
      label: 下载链接
      description: 请输入要下载的文件的完整 URL
      placeholder: https://example.com/file.zip
    validations:
      required: true
      
  - type: input
    id: file_description
    attributes:
      label: 文件描述
      description: 简要描述这是什么文件（可选）
      placeholder: 例如：应用程序安装包、文档、数据文件等
    validations:
      required: false
      
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 其他信息或特殊要求（可选）
      placeholder: 例如：文件密码、特殊处理需求等
    validations:
      required: false
      
  - type: checkboxes
    id: confirmation
    attributes:
      label: 确认
      description: 请确认以下内容
      options:
        - label: 我已确认 URL 是有效的
          required: true
        - label: 我同意此文件会被自动下载并作为 Artifact 保存
          required: true
